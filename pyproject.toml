[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sectest"
version = "0.2.0"
description = "A small, modular AI security evaluation CLI for local Ollama models, inspired by Promptfoo and Garak."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sectest = "ai_security_cli.cli:main"

[tool.setuptools.packages.find]
include = ["ai_security_cli*"]
